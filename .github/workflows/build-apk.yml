name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_HOME (custom)="
          echo "--- SDK check ---"
          for sdkdir in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk ~/android-sdk; do
            if [ -d "$sdkdir" ]; then
              echo "=== $sdkdir ==="
              ls "$sdkdir/platforms/" 2>/dev/null || echo "no platforms"
              ls "$sdkdir/build-tools/" 2>/dev/null || echo "no build-tools"
              ls "$sdkdir/cmdline-tools/" 2>/dev/null || echo "no cmdline-tools"
            fi
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaze-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
