name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK platform 36
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ -d "$SDK" ]; then
            echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
            ls "$SDK/platforms/" 2>/dev/null
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
          SDK2=/usr/lib/android-sdk
          if [ -d "$SDK2" ]; then
            echo "ANDROID_HOME=$SDK2" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=$SDK2" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50

      - name: Build release APK (if keystore configured)
        if: always()
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            set -o pipefail
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} 2>&1 | tail -50
          else
            echo "No keystore configured, skipping release build"
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaze-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (if exists)
        if: always()
        shell: bash
        run: |
          if ls app/build/outputs/apk/release/*.apk 2>/dev/null; then
            echo "found_release=true" >> $GITHUB_ENV
          fi

      - name: Upload release APK
        if: env.found_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kaze-player-release-apk
          path: app/build/outputs/apk/release/*.apk
