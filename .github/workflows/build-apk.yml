name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 36
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 2>&1 | tail -5

      - name: Build debug APK (save log)
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle_output.txt
          echo "gradle_exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Show log tail
        run: tail -80 ../gradle_output.txt 2>/dev/null || echo "no log"

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ../gradle_output.txt

      - name: Fail if build failed
        if: env.gradle_exit_code != '0'
        run: exit 1

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaze-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
